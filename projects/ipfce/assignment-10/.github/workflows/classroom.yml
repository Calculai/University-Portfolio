name: Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read

jobs:
  test-exercises:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    strategy:
      fail-fast: false  # Don't stop on first failure
      matrix:
        exercise: [1, 3, 4, 5]  # List of exercises to test
        include:
          - exercise: 1
            name: "print linked list function"
          - exercise: 3
            name: "sum_squares function"
          - exercise: 4
            name: "map function"
          - exercise: 5
            name: "binary tree functions"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Compile Exercise ${{ matrix.exercise }}
      id: compile
      continue-on-error: true
      run: |
        echo "Compiling Exercise ${{ matrix.exercise }}: ${{ matrix.name }}"
        gcc -Iinclude -o tests/test_exercise${{ matrix.exercise }} \
          tests/test_exercise${{ matrix.exercise }}.c \
          exercise${{ matrix.exercise }}.c
        echo "compile_success=$?" >> $GITHUB_OUTPUT
      
    - name: Run Exercise ${{ matrix.exercise }} Test
      id: test
      continue-on-error: false
      if: steps.compile.outputs.compile_success == '0'
      run: |
        echo "Running Exercise ${{ matrix.exercise }} test..."
        ./tests/test_exercise${{ matrix.exercise }}
      
    - name: Verify Exercise ${{ matrix.exercise }} Results
      uses: classroom-resources/autograding-io-grader@v1
      continue-on-error: true
      id: grader
      if: steps.test.outputs.test_success == '0'
      with:
        test-name: Exercise ${{ matrix.exercise }} ${{ matrix.name }}
        command: echo "Exercise ${{ matrix.exercise }} tests passed"
        expected-output: Exercise ${{ matrix.exercise }} tests passed
        comparison-method: contains
        timeout: 10

  report-results:
    runs-on: ubuntu-latest
    needs: test-exercises
    if: always()  # Run even if some tests failed
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate Summary Report
      run: |
        echo "## 📊 Assignment 6 Autograding Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Exercise | Status | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| 1 | ${{ needs.test-exercises.result }} | print linked list function |" >> $GITHUB_STEP_SUMMARY
        echo "| 3 | ${{ needs.test-exercises.result }} | sum squares function |" >> $GITHUB_STEP_SUMMARY
        echo "| 4 | ${{ needs.test-exercises.result }} | map function |" >> $GITHUB_STEP_SUMMARY
        echo "| 5 | ${{ needs.test-exercises.result }} | binary tree functions |" >> $GITHUB_STEP_SUMMARY